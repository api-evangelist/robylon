aid: robylon
name: Robylon AI
description: Enterprise AI customer-support platform spanning voice, WhatsApp, chat, email, social media
  and ticketing. The platform runs AI agents against a customer knowledge base with configurable personas,
  model selection, human-agent handover and assignment logic, and its APIs let external systems interact
  with Robylon and trigger workflows including voice and outbound automation. Documentation is public
  and extensive and the docs host serves both an llms.txt index and an unauthenticated MCP server; what
  is not published is a machine-readable contract for the product API itself.
